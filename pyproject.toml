[project]
name = "lit"
version = "0.1.0"
description = "Lost in Transcription ID-JV: eval, training and submission tooling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers>=4.53,<5",
    "peft>=0.17",
    "accelerate>=1.8",
    "datasets>=4.0",
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.2",
    "jiwer>=3.1",
    "librosa>=0.11",
    "soundfile>=0.13",
    "polars>=1.30",
    "pandas>=2.2",
    "tqdm",
    "evaluate>=0.4",
]

[project.optional-dependencies]
qwen = ["qwen-asr"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "typer>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lit"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
